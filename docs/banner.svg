<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Software Diversity – Build Pipeline Security</title>
  <desc id="d">Project banner: comparing Maven and Gradle builds to detect a compromised build chain.</desc>
  <rect width="1200" height="300" rx="18" fill="#0a0a0b"/>
  <!-- Portfolio color stripe -->
  <rect x="0" y="0" width="400" height="8" fill="#e8397d"/>
  <rect x="400" y="0" width="400" height="8" fill="#29c282"/>
  <rect x="800" y="0" width="400" height="8" fill="#3d9fe8"/>
  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#3de8a0">RESEARCH · DEVSECOPS · SUPPLY CHAIN</text>
  <text x="60" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#f0ede8">Software Diversity<tspan fill="#e8397d">.</tspan></text>
  <text x="60" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8b8b94">Two builds, one codebase: divergence as an early warning</text>
  <!-- Icon: two build paths converging into a comparison -->
  <g transform="translate(900 70)" fill="none" stroke-width="6" stroke-linecap="round">
    <circle cx="20" cy="30" r="16" stroke="#e8397d"/>
    <circle cx="20" cy="130" r="16" stroke="#3d9fe8"/>
    <path d="M40 30 C 110 30, 110 80, 170 80" stroke="#e8397d"/>
    <path d="M40 130 C 110 130, 110 80, 170 80" stroke="#3d9fe8"/>
    <rect x="170" y="50" width="70" height="60" rx="12" stroke="#29c282"/>
    <path d="M190 80 l12 12 l22 -24" stroke="#29c282"/>
  </g>
</svg>
